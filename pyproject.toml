[project]
name = "coding-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai>=2.50.0", "pydantic>=2.0", "textual>=0.80"]

[project.scripts]
coding-agent = "coding_agent.app:main"

[dependency-groups]
dev = ["pytest>=8.0,<10.0", "pytest-asyncio>=0.23,<2.0", "ruff>=0.8,<1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.ruff]
# Project ruff gates target `src tests` (see README and docs/superpowers specs);
# keep the tooling off the docs/ prose so a whole-repo invocation cannot trip on
# Markdown code fragments that ruff's Markdown formatter rewrites destructively.
extend-exclude = ["docs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in network smoke test; requires explicit environment gate"]
